services:
  landmark:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      # CLIENT_ORIGIN restricts Socket.io/CORS to a specific origin. The
      # default "*" is fine for local/trusted use, but a public
      # deployment should set this to the actual domain the site is
      # served from, e.g. CLIENT_ORIGIN=https://landmark.example.com
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-*}
      # SESSION_SECRET signs the auth tokens issued at login. Left unset,
      # the server generates a random secret on every startup, which
      # means every restart silently logs everyone out - harmless for
      # local development, but a real deployment should set this
      # explicitly to a long random string so sessions survive restarts.
      # Generate one with: openssl rand -hex 32
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in your .env file - see README.md}
      # The accounts allowed into the admin panel, comma-separated (an id is
      # shown on each profile page). See README.md, "Accounts, permissions and the
      # admin panel".
      ADMIN_ACCOUNT_ID: ${ADMIN_ACCOUNT_ID:-}
    volumes:
      # Persists both SQLite databases (rooms + accounts) and uploaded
      # avatars across container restarts/rebuilds. Without this volume,
      # every rebuild would silently start from an empty database.
      - landmark-data:/app/backend/data
    restart: unless-stopped

volumes:
  landmark-data:
