# nginx.conf
# Serves the built React app as static files. On Railway, frontend and
# backend are separate services with their own public URLs (no shared
# Docker network), so the frontend talks to the backend directly over its
# public URL (VITE_SERVER_URL, baked in at build time) instead of nginx
# proxying /api and /socket.io to a "backend" hostname that only exists in
# docker-compose.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip static assets
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Single-page app: any unmatched route falls back to index.html so
    # client-side routing (and a hard refresh on any URL) works correctly.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed build assets aggressively; index.html itself must not be
    # cached so deploys are picked up immediately on next visit.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
