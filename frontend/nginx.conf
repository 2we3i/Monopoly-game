# nginx.conf
# Serves the built React app and proxies /api and /socket.io to the backend
# container, so the browser only ever talks to a single origin (the port
# this container exposes) - no CORS configuration needed by the host.

# Standard WebSocket-upgrade map: only sets the Connection header to
# "upgrade" when the client's request actually asked for one, falling back
# to "close" otherwise. Using a hardcoded "upgrade" value for every request
# on this location block is a common but incorrect shortcut - this map is
# the pattern documented by nginx itself for proxying WebSocket traffic.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip static assets
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Socket.io needs WebSocket upgrade headers passed through explicitly.
    location /socket.io/ {
        proxy_pass http://backend:4000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Long-lived connections - don't let nginx time them out aggressively.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Single-page app: any unmatched route falls back to index.html so
    # client-side routing (and a hard refresh on any URL) works correctly.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed build assets aggressively; index.html itself must not be
    # cached so deploys are picked up immediately on next visit.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
